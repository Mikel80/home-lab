apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: pays
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      # securityContext:
      #   fsGroup: 101
      #   runAsUser: 101
      #   runAsGroup: 101
      containers:
        - name: frontend
          image: pays-front:latest-local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: frontend-config
          ports:
            - containerPort: 80
          # securityContext:
          #   allowPrivilegeEscalation: false