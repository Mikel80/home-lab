apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: pays
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      # securityContext:
      #   fsGroup: 101
      #   runAsUser: 101
      #   runAsGroup: 101
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432; do echo "waiting for postgres"; sleep 2; done
      containers:
        - name: backend
          image: pays-back:latest-local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
          ports:
            - containerPort: 80
          # securityContext:
          #   allowPrivilegeEscalation: false